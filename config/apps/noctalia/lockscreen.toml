[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "login_box", "clock", "weather" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."login_box"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 975.0
    # output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."login_box".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.clock]
    box_height = 192.0
    box_width = 320.0
    cx = 1696.0
    cy = 124.0
    # output = "HDMI-A-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.clock.settings]
        background = false
        center_text = false
        clock_style = "digital"
        color = "on_surface"
        format = "%H:%M\\n%d/%m"
        shadow = true

    [lockscreen_widgets.widget.weather]
    box_height = 112.0
    box_width = 224.0
    cx = 1744.0
    cy = 276.0
    # output = "HDMI-A-1"
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.weather.settings]
        background = false
